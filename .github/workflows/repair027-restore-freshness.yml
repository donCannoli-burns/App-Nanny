name: Repair 027 Restore transaction freshness

on:
  push:
    branches:
      - repair/027-restore-transaction-freshness
  pull_request:
    branches:
      - repair/026-authority-modal-isolation

permissions:
  contents: read

jobs:
  restore-freshness:
    name: Fence in-flight Restore against newer authority
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify exact sources and test bytes; check JS/Python syntax
        run: |
          echo '9985d4182d1b0835fcea640005fe1558ca161a4fc03729d94e9585d2c4fd2c7b  studio/context_tree_studio_authority_repaired_027.html' | sha256sum -c -
          echo 'a6f26848ec169adc7e6ba127aa6e126df482e77d3e46cee12335c5ab88eb7f57  tests/test_restore_freshness_027.py' | sha256sum -c -
          echo '0f3b37f2c0f8f1ec5d2046a5ee11fa73323b715161b6f065751363f9382f6a98  studio/context_tree_studio_authority_repaired_026.html' | sha256sum -c -
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('studio/context_tree_studio_authority_repaired_027.html').read_text('utf-8')
          m=re.search(r'<script>(.*?)</script>',html,re.S)
          assert m
          Path('/tmp/app-nanny-027.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app-nanny-027.js
          python -m py_compile tests/test_restore_freshness_027.py
      - name: Repair 020 metadata contract
        run: python tests/test_metadata_contract_020.py --html studio/context_tree_studio_authority_repaired_027.html --json /tmp/repair020-on027.json
      - name: Repair 021 strict JSON admission
        run: python tests/test_duplicate_json_021.py --html studio/context_tree_studio_authority_repaired_027.html --results /tmp/repair021-on027.json
      - name: Repair 022 scaffold admission
        run: python tests/test_scaffold_admission_022.py --html studio/context_tree_studio_authority_repaired_027.html --results /tmp/repair022-on027.json
      - name: Repair 023 fatal UTF-8 admission
        run: python tests/test_file_picker_utf8_023.py --html studio/context_tree_studio_authority_repaired_027.html --results /tmp/repair023-on027.json
      - name: Repair 024 file-picker freshness
        run: python tests/test_file_picker_freshness_024.py --html studio/context_tree_studio_authority_repaired_027.html --results /tmp/repair024-on027.json
      - name: Repair 025 authority-dialog read freshness
        run: python tests/test_authority_dialog_read_freshness_025.py --html studio/context_tree_studio_authority_repaired_027.html --results /tmp/repair025-on027.json
      - name: Repair 026 authority modal isolation
        run: python tests/test_authority_modal_isolation_026.py --html studio/context_tree_studio_authority_repaired_027.html --results /tmp/repair026-on027.json
      - name: Repair 027 deferred Restore transaction freshness
        run: python tests/test_restore_freshness_027.py --results /tmp/repair027.json
